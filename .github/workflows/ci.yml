name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API · build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  web:
    name: Web · lint + unit tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    name: Integration (${{ matrix.payment-gateway }}) · API smoke + browser E2E
    needs: [api, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mock: hosted mock checkout page. omise: real Omise integration against tools/fake-omise.cjs (PromptPay QR).
        payment-gateway: [mock, omise]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting_saas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: accounting_saas_dev
      # Throwaway secret: the CI database and tokens only live for this job.
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789
      PAYMENT_PROVIDER: ${{ matrix.payment-gateway }}
      OMISE_SECRET_KEY: skey_test_ci
      OMISE_API_URL: http://localhost:4010
      APP_URL: http://localhost:5173
      PGPASSWORD: postgres # psql in the smoke test (RLS and expiry checks)
      E2E_BROWSER: chrome # preinstalled on ubuntu runners
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web

      - name: Migrate database (as owner)
        run: npm run migration:run
      - name: Create least-privilege login role
        run: psql -h localhost -U postgres -d accounting_saas_dev -v login=accounting_app -v password=ci-app-password -f db/create-app-login.sql
      - name: Start fake Omise
        if: matrix.payment-gateway == 'omise'
        env:
          PORT: 4010
          WEBHOOK_URL: http://localhost:3000/api/v1/billing/webhooks/omise
        run: nohup node tools/fake-omise.cjs > omise.log 2>&1 &
      - name: Build and start API (production mode, as accounting_app)
        # NODE_ENV=production makes the API refuse superuser/BYPASSRLS roles and restrict CORS to APP_URL,
        # so this job proves the production setup, with the real rate limits.
        env:
          NODE_ENV: production
          DB_USERNAME: accounting_app
          DB_PASSWORD: ci-app-password
          SWAGGER_ENABLED: 'true'
        run: |
          npm run build
          nohup npm run start:prod > api.log 2>&1 &
      - name: Start web dev server
        working-directory: web
        run: nohup npx vite --port 5173 --strictPort > ../web.log 2>&1 &
      - name: Wait for API and web
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health > /dev/null && curl -sf http://localhost:5173 > /dev/null; then
              echo "ready after $((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "servers did not start"; cat api.log web.log; exit 1

      - name: API smoke test
        shell: pwsh
        run: ./tests/smoke-test.ps1
      - name: Browser E2E
        working-directory: web
        run: npm run e2e

      - name: Upload screenshots and server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts-${{ matrix.payment-gateway }}
          path: |
            web/e2e/screenshots
            api.log
            web.log
            omise.log
          retention-days: 7
